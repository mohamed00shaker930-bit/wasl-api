# Dev / single-server stack for Wasl. Prod: same file with the `.env.prod` values and Caddy on 80/443.
#   docker compose up -d postgres minio        # databases only (API from `pnpm start:dev`, web from `vite dev`)
#   docker compose --profile full up -d        # everything, served by Caddy on :80
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: wasl, POSTGRES_USER: wasl, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wasl} }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U wasl -d wasl"], interval: 5s, timeout: 3s, retries: 20 }

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}, MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin} }
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 3s, retries: 20 }

  minio-init:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      for b in products-library custom-requests product-images store-images banners; do mc mb -p local/$$b; mc anonymous set download local/$$b; done"

  api:
    profiles: [full]
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://wasl:${POSTGRES_PASSWORD:-wasl}@postgres:5432/wasl
      STORAGE_DRIVER: minio
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: ${PUBLIC_URL:-http://localhost}/files
      CORS_ORIGINS: ""
    depends_on: { postgres: { condition: service_healthy }, minio-init: { condition: service_completed_successfully } }
    restart: unless-stopped

  web:
    profiles: [full]
    build: ../wasl-web
    restart: unless-stopped

  caddy:
    profiles: [full]
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data]
    environment: { SITE_ADDRESS: ${SITE_ADDRESS:-:80} }
    depends_on: [api, web, minio]
    restart: unless-stopped

  uptime-kuma:
    profiles: [full]
    image: louislam/uptime-kuma:1
    volumes: [kumadata:/app/data]
    ports: ["3001:3001"]
    restart: unless-stopped

volumes: { pgdata: {}, miniodata: {}, caddydata: {}, kumadata: {} }
